[paths]
build = "_build"
merged = "_Merged"
conflicts = "_Conflicts"
tracking = "_Merged/.upstream_tracking"
patch = "_My Patch"

[templates]
replace = "{source_dir}/{source_name}_replace_{source_mod_id}.txt"
merge = "{source_dir}/����_all_merged_common_items_replace.txt"
